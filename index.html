<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prism</title>
<style>
  :root {
    --bg: #070707;
    --panel: #101010;
    --panel-2: #161616;
    --line: #1c1c1c;
    --text: #ededed;
    --muted: #7a7a7a;
    --dim: #4a4a4a;
    --thumb: #5a5a5a;
    --fill: #1d1d1d;
    --stage: #0b0b0b;
    --pill: #262626;
    --radius: 16px;
  }
  :root[data-theme="light"] {
    --bg: #f4f3f1;
    --panel: #ffffff;
    --panel-2: #efeeeb;
    --line: #e6e4e0;
    --text: #17171a;
    --muted: #8a8884;
    --dim: #c9c7c2;
    --thumb: #a8a49d;
    --fill: #e8e6e2;
    --stage: #e9e7e3;
    --pill: #ffffff;
  }
  :root[data-theme="light"] input[type=range] { background: linear-gradient(90deg, var(--fill) var(--p, 50%), #f3f2ef var(--p, 50%)); }
  :root[data-theme="light"] input[type=range]:hover::-webkit-slider-thumb { background: #b2afa8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .app {
    max-width: 1680px;
    height: 100%;
    margin: 0 auto;
    padding: 0 24px;
    display: grid;
    grid-template-rows: 80px minmax(0, 1fr) 56px;
  }

  .top { display: flex; align-items: center; gap: 18px; }
  .logo { font: 500 22px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: -0.02em; }
  .top .right { margin-left: auto; display: flex; gap: 4px; color: var(--muted); }
  .top .right button {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 9px;
    transition: color 0.15s, background 0.15s;
  }
  .top .right button:hover { color: var(--text); background: var(--panel); }
  .top .right svg { width: 16px; height: 16px; stroke-width: 1.6; }
  .icon-off { display: none; }
  .app.no-side .side { display: none; }
  .app.no-side .main { grid-template-columns: minmax(0, 1fr); }
  .app.no-side #side-toggle, .app.fs #fs-toggle { color: var(--text); }
  .app.no-side #side-toggle .icon-on, .app.fs #fs-toggle .icon-on { display: none; }
  .app.no-side #side-toggle .icon-off, .app.fs #fs-toggle .icon-off { display: inline; }
  :root[data-theme="light"] #theme .icon-on { display: none; }
  :root[data-theme="light"] #theme .icon-off { display: inline; }

  .main {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 10px;
  }

  .preview {
    position: relative;
    min-height: 0;
    display: flex;
  }
  .label {
    font-size: 10px;
    letter-spacing: 0.34em;
    color: var(--muted);
    text-transform: uppercase;
  }
  #stage {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--stage);
    touch-action: none;
  }
  #stage:fullscreen, #stage.pseudo-fs { border-radius: 0; }
  /* Fallback when the Fullscreen API is refused (embedded views, some
     mobile browsers): the stage simply covers the window. */
  #stage.pseudo-fs { position: fixed; inset: 0; z-index: 50; }
  #fs-exit {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    display: none; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 9px;
    color: rgba(50, 46, 42, 0.7); background: rgba(255, 255, 255, 0.35);
  }
  #fs-exit svg { width: 16px; height: 16px; stroke-width: 1.6; }
  #stage.pseudo-fs #fs-exit { display: inline-flex; }
  #stage.dark #fs-exit { color: rgba(255, 255, 255, 0.8); background: rgba(0, 0, 0, 0.3); }
  #stage { cursor: grab; }
  #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  /* Light source: one quiet dot. The beam itself says where the light goes. */
  #src {
    position: absolute;
    width: 28px; height: 28px;
    margin: -14px 0 0 -14px;
    cursor: grab;
    touch-action: none;
  }
  #src::before {
    content: "";
    position: absolute; inset: 9px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(50, 46, 42, 0.45), 0 0 10px 3px rgba(255, 255, 255, 0.7);
    transition: transform 0.15s;
  }
  #src:hover::before { transform: scale(1.3); }
  #src:active { cursor: grabbing; }
  #stage.dark #src::before { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35), 0 0 12px 4px rgba(255, 255, 255, 0.5); }
  #err {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    padding: 40px; text-align: center;
    color: var(--muted);
  }

  .side {
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: none;
  }
  .side::-webkit-scrollbar { display: none; }
  .card { background: var(--panel); border-radius: var(--radius); padding: 14px 14px 13px; }
  .card > .label { display: block; margin-bottom: 11px; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; margin-bottom: 10px; padding: 3px; border-radius: 10px; background: var(--panel-2); }
  .seg:last-child { margin-bottom: 0; }
  .seg button { padding: 6px 4px; border-radius: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; text-transform: lowercase; transition: background 0.15s, color 0.15s; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--pill); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18); }

  .row { margin-bottom: 10px; }
  .row:last-child { margin-bottom: 0; }
  .row .head { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px; font-weight: 500; text-transform: lowercase; }
  .row .head output { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    display: block;
    width: 100%; height: 22px; margin: 0;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--fill) var(--p, 50%), #131313 var(--p, 50%));
    cursor: ew-resize;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 3px; height: 22px;
    border-radius: 2px;
    background: var(--thumb);
  }
  input[type=range]::-moz-range-thumb {
    width: 3px; height: 22px;
    border: 0; border-radius: 2px;
    background: var(--thumb);
  }
  input[type=range]:hover::-webkit-slider-thumb { background: #4a4a4a; }

  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .pair button { padding: 7px; border-radius: 8px; background: var(--panel-2); color: var(--muted); font-size: 12px; text-transform: lowercase; }
  .pair button:hover { color: var(--text); }
  .pair button:active { transform: scale(0.98); }

  .foot {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    color: var(--muted); font-size: 12px; letter-spacing: 0.08em; user-select: none;
  }
  .foot a { color: inherit; text-decoration: none; transition: color 0.2s; }
  .foot a:hover { color: var(--text); }
  #heart {
    display: inline-flex; align-items: center; padding: 0 2px; margin: 0 1px;
    color: inherit; vertical-align: -1px;
  }
  #heart svg { display: block; transition: transform 0.2s; transform-origin: center; overflow: visible; }
  #heart .outline { fill: none; stroke: currentColor; stroke-width: 1.7; transition: opacity 0.25s; }
  #heart .glass { opacity: 0; transition: opacity 0.3s; }
  /* Liked: the outline becomes a small block of frosted glass with a beam of split light inside. */
  #heart.liked .outline { opacity: 0; }
  #heart.liked .glass { opacity: 1; }
  #heart.liked svg { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35)); }
  :root[data-theme="light"] #heart.liked svg { filter: drop-shadow(0 1px 2px rgba(60, 50, 40, 0.28)); }
  #heart.pop svg { animation: heartPop 0.35s ease; }
  #heart:hover svg { animation: heartSway 0.7s ease-in-out infinite; }
  @keyframes heartSway {
    0%, 100% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-11deg) scale(1.12); }
    75% { transform: rotate(11deg) scale(1.12); }
  }
  @keyframes heartPop {
    0% { transform: scale(1); }
    45% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  @media (max-width: 900px) {
    html, body { height: auto; }
    .app { height: auto; grid-template-rows: 64px auto auto; padding: 0 12px; }
    .main { grid-template-columns: 1fr; gap: 10px; }
    .preview { height: min(78vh, 100vw); }
    .side { overflow: visible; }
    .foot { padding: 16px 0; }
    .top .right { gap: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">prism</div>
    <div class="right">
      <button id="reset" title="reset" aria-label="reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button id="theme" title="light / dark interface" aria-label="theme">
        <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
      </button>
      <button id="side-toggle" title="show / hide controls" aria-label="controls">
        <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/><path d="M15 12h6" /></svg>
      </button>
      <button id="fs-toggle" title="fullscreen" aria-label="fullscreen">
        <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/><path d="M9 21H3v-6"/></svg>
        <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m14 10 7-7"/><path d="M20 10h-6V4"/><path d="m3 21 7-7"/><path d="M4 14h6v6"/></svg>
      </button>
    </div>
  </header>

  <main class="main">
    <section class="preview">
      <div id="stage">
        <div id="src" title="Drag to move the light"></div>
        <button id="fs-exit" title="exit fullscreen" aria-label="exit fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m14 10 7-7"/><path d="M20 10h-6V4"/><path d="m3 21 7-7"/><path d="M4 14h6v6"/></svg>
        </button>
        <div id="err"></div>
      </div>
    </section>

    <aside class="side">
      <div class="card">
        <span class="label">Element</span>
        <div class="seg" data-key="mode">
          <button data-val="p">Prism</button>
          <button data-val="s">Film</button>
        </div>
        <div class="row"><div class="head"><span>Size</span><output></output></div>
          <input type="range" data-key="size" min="10" max="100" step="1"></div>
      </div>

      <div class="card">
        <span class="label">Pattern</span>
        <div class="seg" data-key="lay">
          <button data-val="rings">Rings</button>
          <button data-val="ring">Circle</button>
          <button data-val="spiral">Spiral</button>
          <button data-val="grid">Grid</button>
          <button data-val="hex">Hex</button>
        </div>
        <div class="seg" data-key="ori">
          <button data-val="in">Inward</button>
          <button data-val="out">Outward</button>
          <button data-val="same">Aligned</button>
          <button data-val="alt">Alternate</button>
        </div>
        <div class="pair">
          <button id="ring-less">− Remove ring</button>
          <button id="ring-more">+ Add ring</button>
        </div>
        <div class="row"><div class="head"><span>Count</span><output></output></div>
          <input type="range" data-key="count" min="1" max="90" step="1"></div>
        <div class="row"><div class="head"><span>Spacing</span><output></output></div>
          <input type="range" data-key="gap" min="30" max="220" step="1"></div>
        <div class="seg" data-key="spin" style="margin-top: 12px">
          <button data-val="on">Rotating</button>
          <button data-val="off">Still</button>
        </div>
      </div>

      <div class="card">
        <span class="label">Light</span>
        <div class="seg" data-key="src">
          <button data-val="beam">Beam</button>
          <button data-val="point">Point</button>
        </div>
        <div class="row"><div class="head"><span>Width</span><output></output></div>
          <input type="range" data-key="width" min="10" max="700" step="5"></div>
        <div class="row"><div class="head"><span>Brightness</span><output></output></div>
          <input type="range" data-key="bright" min="20" max="300" step="5"></div>
        <div class="row"><div class="head"><span>Dispersion</span><output></output></div>
          <input type="range" data-key="disp" min="0" max="100" step="1"></div>
      </div>

      <div class="card">
        <span class="label">Surface</span>
        <div class="seg" data-key="bg">
          <button data-val="wall">White wall</button>
          <button data-val="trees">Tree shade</button>
          <button data-val="dark">Dark room</button>
        </div>
      </div>
    </aside>
  </main>

  <footer class="foot">
    made with
    <button id="heart" aria-label="like">
      <svg width="15" height="15" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <path id="heart-shape" d="M2 9.1371C2 14 6.01943 16.5914 8.96173 18.9109C10 19.7294 11 20.5 12 20.5C13 20.5 14 19.7294 15.0383 18.9109C17.9806 16.5914 22 14 22 9.1371C22 4.27416 16.4998 0.825464 12 5.50063C7.50016 0.825464 2 4.27416 2 9.1371Z"/>
          <clipPath id="heart-clip"><use href="#heart-shape"/></clipPath>
          <linearGradient id="heart-body" x1="0.15" y1="0" x2="0.85" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="0.45" stop-color="#c9c6c0" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#eeece8" stop-opacity="0.95"/>
          </linearGradient>
          <linearGradient id="heart-beam" x1="0" y1="0.3" x2="1" y2="0.7">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="0.5" stop-color="#ffd6a8"/>
            <stop offset="0.62" stop-color="#bff2c9"/>
            <stop offset="0.74" stop-color="#b3d4ff"/>
            <stop offset="0.86" stop-color="#d9c4ff"/>
            <stop offset="1" stop-color="#d9c4ff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <use class="outline" href="#heart-shape"/>
        <g class="glass">
          <use href="#heart-shape" fill="url(#heart-body)"/>
          <g clip-path="url(#heart-clip)">
            <path d="M1 7 L23 12 L23 15.5 L1 10.5 Z" fill="url(#heart-beam)" opacity="0.85"/>
            <use href="#heart-shape" fill="none" stroke="#ffffff" stroke-width="3.2" opacity="0.7"/>
            <path d="M5.2 9.4 C5.6 6.8 7.6 5.4 9.6 5.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
          </g>
          <use href="#heart-shape" fill="none" stroke="rgba(90,84,76,0.35)" stroke-width="0.9"/>
        </g>
      </svg>
    </button>
    by <a href="https://x.com/yuxuan_o_o" target="_blank" rel="noopener">Yuxuan</a> · AI
  </footer>
</div>

    var el = document.getElementById('err');
    if (!el) return;
    el.style.display = 'flex';
    el.textContent = 'Could not start: ' + (e.message || 'three.js failed to load (needs internet for the CDN).');

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

// ---------- state ----------
const DEFAULTS = {
  src: 'beam', width: 260, bright: 100, disp: 50,
  mode: 'p', size: 38,
  lay: 'rings', ori: 'in', count: 18, gap: 92,
  bg: 'wall', spin: 'on',
};
const S = { ...DEFAULTS };

// Simulation space: fixed height, width follows the stage aspect.
const SH = 760;
let SW = 1100, CX = SW / 2, CY = SH / 2;
const MAXN = 90;

let aim = 0, theta = 0, lastT = 0, quality = 1, dirty = true;
const source = { x: 46, y: SH / 2 };
let base = [], born = [], items = [], edges = [];

// ---------- spectrum ----------
const NW = 24, lams = [], cols = [], us = [];
function wavelengthRGB(l) {
  let r = 0, g = 0, b = 0;
  if (l < 440) { r = -(l - 440) / 60; b = 1; }
  else if (l < 490) { g = (l - 440) / 50; b = 1; }
  else if (l < 510) { g = 1; b = -(l - 510) / 20; }
  else if (l < 580) { r = (l - 510) / 70; g = 1; }
  else if (l < 645) { r = 1; g = -(l - 645) / 65; }
  else { r = 1; }
  let f = 1;
  if (l < 420) f = 0.3 + 0.7 * (l - 380) / 40;
  else if (l > 680) f = 0.3 + 0.7 * (780 - l) / 100;
  return [r * f, g * f, b * f];
}
const rawCols = [], sum = [0, 0, 0];
for (let i = 0; i < NW; i++) {
  const l = 690 - (280 * i) / (NW - 1);
  lams.push(l);
  const c = wavelengthRGB(l);
  rawCols.push(c);
  sum[0] += c[0]; sum[1] += c[1]; sum[2] += c[2];
  us.push((1 / (l * l) - 1 / (700 * 700)) / (1 / (400 * 400) - 1 / (700 * 700)));
}
// Balance channels so that all wavelengths together add up to white.
const SUM = Math.min(sum[0], sum[1], sum[2]);
for (let i = 0; i < NW; i++) {
  const c = rawCols[i];
  cols.push(`rgb(${Math.round(255 * c[0] * SUM / sum[0])},${Math.round(255 * c[1] * SUM / sum[1])},${Math.round(255 * c[2] * SUM / sum[2])})`);
}

// ---------- layout ----------
function ringCap(k, sp) {
  const R = sp * (1 + k * 1.07);
  return [R, Math.max(3, Math.floor(2 * Math.PI * R / (sp * 0.95)))];
}
function ringStep(n, sp, dir) {
  let left = n, k = 0, last = null;
  while (left > 0) {
    const cap = ringCap(k, sp)[1], m = Math.min(cap, left);
    last = [cap, m]; left -= m; k++;
  }
  if (dir > 0) {
    if (last && last[1] < last[0]) return n + last[0] - last[1];
    return n + ringCap(k, sp)[1];
  }
  return Math.max(1, n - (last ? last[1] : 0));
}
function layout() {
  const n = S.count, sp = S.gap, L = S.lay, P = [];
  if (n === 1) {
    P.push([0, 0]);
  } else if (L === 'rings') {
    let left = n, k = 0;
    while (left > 0) {
      const [R, cap] = ringCap(k, sp), m = Math.min(cap, left);
      for (let i = 0; i < m; i++) {
        const a = -Math.PI / 2 + i / m * Math.PI * 2 + (k % 2 ? Math.PI / m : 0);
        P.push([Math.cos(a) * R, Math.sin(a) * R]);
      }
      left -= m; k++;
    }
  } else if (L === 'ring') {
    const R = Math.max(sp, n * sp * 0.9 / (2 * Math.PI));
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + i / n * Math.PI * 2;
      P.push([Math.cos(a) * R, Math.sin(a) * R]);
    }
  } else if (L === 'spiral') {
    const g = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < n; i++) {
      const R = sp * 0.6 * Math.sqrt(i + 0.6), a = i * g;
      P.push([Math.cos(a) * R, Math.sin(a) * R]);
    }
  } else {
    const hex = L === 'hex', s = sp * 1.05, sy = hex ? s * 0.866 : s;
    const c = Math.max(1, Math.ceil(Math.sqrt(n * SW / SH))), rows = Math.ceil(n / c);
    for (let i = 0; i < n; i++) {

$$('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) set(seg.dataset.key, b.dataset.val);
}));
$$('input[type=range]').forEach(inp => inp.addEventListener('input', () => set(inp.dataset.key, +inp.value)));
$('#ring-more').addEventListener('click', () => {
  const n = S.lay === 'rings' ? ringStep(S.count, S.gap, 1) : S.count + 6;
  set('count', Math.min(MAXN, n));
});
$('#ring-less').addEventListener('click', () => {
  const n = S.lay === 'rings' ? ringStep(S.count, S.gap, -1) : S.count - 6;
  set('count', Math.max(1, n));
});
const root = document.documentElement;
function applyTheme(t) {
  root.dataset.theme = t;
  try { localStorage.setItem('prism-theme', t); } catch (_) {}
}
try {
  applyTheme(localStorage.getItem('prism-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
} catch (_) { applyTheme('dark'); }
$('#theme').addEventListener('click', () => applyTheme(root.dataset.theme === 'light' ? 'dark' : 'light'));

// Controls can be tucked away so the wall takes the whole width.
const app = $('.app');
$('#side-toggle').addEventListener('click', () => {
  app.classList.toggle('no-side');
  try { localStorage.setItem('prism-side', app.classList.contains('no-side') ? 'off' : 'on'); } catch (_) {}
});
try { if (localStorage.getItem('prism-side') === 'off') app.classList.add('no-side'); } catch (_) {}

// Fullscreen shows the wall alone. If the browser refuses the real thing,
// the stage covers the window instead.
const isFull = () => !!document.fullscreenElement || stage.classList.contains('pseudo-fs');
function setPseudo(on) {
  stage.classList.toggle('pseudo-fs', on);
  app.classList.toggle('fs', on);
  resize();
}
$('#fs-toggle').addEventListener('click', () => {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  if (stage.classList.contains('pseudo-fs')) { setPseudo(false); return; }
  const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
  let p = null;
  try { p = req ? req.call(stage) : null; } catch (_) {}
  if (p && p.catch) p.catch(() => setPseudo(true));
  // Some hosts neither honour nor reject the request: fall back after a beat.
  setTimeout(() => { if (!document.fullscreenElement && !stage.classList.contains('pseudo-fs')) setPseudo(true); }, 400);
});
document.addEventListener('fullscreenchange', () => app.classList.toggle('fs', !!document.fullscreenElement));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && stage.classList.contains('pseudo-fs')) setPseudo(false); });
$('#fs-exit').addEventListener('pointerdown', e => e.stopPropagation());
$('#fs-exit').addEventListener('click', () => setPseudo(false));

// Footer heart: liked state fills it with prism light; one anonymous count per browser.
const HEART_HIT = 'https://abacus.jasoncameron.dev/hit/prism-yuxuan/hearts';
const heart = $('#heart');
let liked = false, counted = false;
try { liked = localStorage.getItem('prism-liked') === '1'; counted = localStorage.getItem('prism-counted') === '1'; } catch (_) {}
heart.classList.toggle('liked', liked);
heart.addEventListener('click', () => {
  liked = !liked;
  try { localStorage.setItem('prism-liked', liked ? '1' : '0'); } catch (_) {}
  if (liked && !counted) {
    counted = true;
    try { localStorage.setItem('prism-counted', '1'); } catch (_) {}
    fetch(HEART_HIT).catch(() => {});
  }
  heart.classList.remove('pop');
  void heart.offsetWidth;
  heart.classList.add('pop');
  heart.classList.toggle('liked', liked);
});
heart.addEventListener('animationend', () => heart.classList.remove('pop'));

$('#reset').addEventListener('click', () => {
  Object.assign(S, DEFAULTS);
  aim = 0; theta = 0;
  source.x = 46; source.y = CY;
  born = []; base = [];
  placeHandle();
  layout();
  syncUI();
});

// ---------- loop ----------
function frame(now) {
  requestAnimationFrame(frame);
  tick(now);
}
function tick(now) {
  if (S.spin === 'on' && !dragging && !turning) {
    const dt = lastT ? Math.min(60, now - lastT) : 16;
    theta += dt * 0.0001;
    dirty = true;
  }
  lastT = now;

  if (dirty) {
    const t0 = performance.now();
    const popping = place(performance.now());
    trace();
    drawShadows();
    syncMeshes();
    lightTex.needsUpdate = true;
    shadowTex.needsUpdate = true;
    dirty = popping;
    const el = performance.now() - t0;
    if (el > 30) quality = Math.max(0.35, quality * 0.88);
    else if (el < 16) quality = Math.min(1, quality * 1.04);
  }

  wallMat.uniforms.uTime.value = now / 1000;

  // Pass 1: the lit wall alone, for the glass to refract.
  prisms.visible = false;
  films.visible = false;
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene, camera);
  // Pass 2: the wall again, with the glass on top.
  renderer.setRenderTarget(null);
  prisms.visible = true;
  films.visible = true;
  renderer.render(scene, camera);
}

resize();
layout();
syncUI();
started = true;
requestAnimationFrame(frame);
// Lets a hidden tab (where requestAnimationFrame is paused) be stepped by hand.
window.__prism = { step: () => tick(performance.now()), state: S };
</script>
</body>
</html>
